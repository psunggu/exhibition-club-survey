name: Validate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security-and-content:
    name: Security and content checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check repository hygiene
        run: node scripts/validate-repository-hygiene.mjs

      - name: Validate public weekly digest
        run: node scripts/validate-weekly-digest.mjs

      - name: Validate Supabase read-only boundary
        run: node scripts/validate-supabase-readonly.mjs

      - name: Validate Supabase P1 hardening
        run: node scripts/validate-supabase-p1.mjs

      - name: Check public JavaScript syntax
        run: |
          node --check app/public/app.js
          node --check app/public/config.js
          node --check app/public/notice.js
