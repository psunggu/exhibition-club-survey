name: Deploy exhibition page

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment_retry.outputs.page_url || steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check repository hygiene
        run: node scripts/validate-repository-hygiene.mjs

      - name: Validate public weekly digest
        run: node scripts/validate-weekly-digest.mjs

      - name: Validate Supabase read-only boundary
        run: node scripts/validate-supabase-readonly.mjs

      - name: Validate Supabase P1 hardening
        run: node scripts/validate-supabase-p1.mjs

      - name: Check public JavaScript syntax
        run: node --check exhibition_club_codex_package/public/app.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: exhibition_club_codex_package/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      # The action caps a single deployment wait at 10 minutes. A fresh request
      # can leave an intermittent Pages queue without rebuilding or reuploading.
      - name: Retry GitHub Pages deployment after a queue timeout
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Fail when both GitHub Pages deployment attempts fail
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        run: exit 1
