name: Deploy exhibition page

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment_retry.outputs.page_url || steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 빌드는 배포 경로가 아직 app/public 이라 나가지 않는다.
      # 그래도 돌려서 타입·번들이 깨진 채 쌓이지 않게 한다 (Phase 01).
      - name: Build (tsc + vite)
        run: npm run build

      - name: Validate CSP of build output
        run: node scripts/validate-csp-build.mjs

      # 화면이 그대로인지 숫자로 대조한다. playwright 가 없으면 스스로 건너뛴다.
      - name: 화면 대조 (디자인 불변)
        run: |
          npx playwright install --with-deps chromium
          node scripts/snapshot-screens.mjs check

      - name: Check repository hygiene
        run: node scripts/validate-repository-hygiene.mjs

      - name: Validate public weekly digest
        run: node scripts/validate-weekly-digest.mjs

      - name: Validate sample member fixtures
        run: node scripts/validate-fixtures.mjs

      - name: Validate board port parity
        run: node scripts/validate-board-parity.mjs

      - name: Validate Supabase read-only boundary
        run: node scripts/validate-supabase-readonly.mjs

      - name: Validate Supabase P1 hardening
        run: node scripts/validate-supabase-p1.mjs

      - name: Check public JavaScript syntax
        run: node --check app/public/app.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # ── 여기가 라이브다 ───────────────────────────────────────
      # 2026-08-20 에 dist → app/public 으로 **되돌렸다.**
      # 이식본을 띄워 봤더니 옛 화면이 낫다는 판단이 나왔다 —
      # 색·배치·구성이 완성돼 있고 이식본은 그만큼이 아니었다.
      #
      # 이식 작업은 버리지 않았다. fix/restore-legacy-design 브랜치와
      # PR #29 에 그대로 있고, 옛 화면과 계산된 스타일이 일치하는 것까지는
      # 맞춰 두었다(scripts/compare-with-legacy.mjs). 다시 올릴 때 이어서 한다.
      #
      # dist 에 들어가는 것
      #   index.html                 SPA 진입점 (보드 · 달력)
      #   notice.html                옛 주소용 리다이렉트 → #/calendar
      #   config.js                  app/public 에서 그대로 가져온다 (키는 한 곳에만)
      #   weekly-digest.public.json  위와 같다
      #   assets/                    해시 붙은 번들
      #
      # app/public 의 옛 페이지는 저장소에 남아 있지만 **더 이상 배포되지 않는다.**
      # 검증 스크립트 셋이 아직 그 파일을 읽고 있어 같은 커밋에서 지우지 않았다.
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: app/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      # Pages cancels a timed-out request asynchronously, so let that state
      # settle before asking it to deploy the same uploaded artifact again.
      - name: Wait for Pages deployment cancellation to settle
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - name: Retry GitHub Pages deployment after a queue timeout
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Fail when both GitHub Pages deployment attempts fail
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        run: exit 1
