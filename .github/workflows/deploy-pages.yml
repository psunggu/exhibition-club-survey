name: Deploy exhibition page

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate public weekly digest
        run: node scripts/validate-weekly-digest.mjs

      - name: Validate Supabase read-only boundary
        run: node scripts/validate-supabase-readonly.mjs

      - name: Check public JavaScript syntax
        run: node --check exhibition_club_codex_package/public/app.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: exhibition_club_codex_package/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
