<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Language" content="ko-KR" />
  <!--
    CSP는 지금 라이브 페이지와 같은 수준으로 유지한다 (R-01-07).
    인라인 <script>·<style>·style= 을 하나도 허용하지 않는다.
    빌드가 인라인을 뿜지 않는지는 `npm run check:csp` 가 확인한다.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self'; style-src-attr 'none'; connect-src 'self' https://*.supabase.co; img-src 'self' data: https://www.mmca.go.kr https://sema.seoul.go.kr https://www.sac.or.kr https://center.sac.or.kr https://www.museum.go.kr https://dive.hyundaicard.com https://naverbooking-phinf.pstatic.net https://www.kobis.or.kr https://kopis.or.kr; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>문화 콘텐츠 공유 보드</title>
  <meta name="description" content="100주년 기념교회 41교구 전시·박물관 동아리에서 서울·경기·인천의 전시·음악공연·영화 정보를 함께 나누는 문화 콘텐츠 공유 보드" />
  <!--
    링크 미리보기 카드(카카오톡 · 문자)와 홈 화면 아이콘 (2026-11-23).
    그림은 scripts/make-share-images.mjs 가 그린다 — 바꾸면 아래 ?v= 를 올린다(카카오톡이 옛 카드를 붙들고 있다).
    주소의 # 뒤는 미리보기를 만드는 쪽에 가지 않는다 — #/calendar 를 붙여도 같은 카드다.
    og:image 는 절대 주소여야 한다. meta 의 content 는 불러오는 자리가 아니라 CSP 와 상관없다.
  -->
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="ko_KR" />
  <meta property="og:site_name" content="41교구 전시·박물관 동아리" />
  <meta property="og:title" content="41교구 전시·박물관 동아리" />
  <meta property="og:description" content="모임 일정 · 관람 정보 · 투표 — 다가오는 모임과 서울·경기·인천의 전시·공연·영화를 한곳에서 봅니다." />
  <meta property="og:url" content="https://psunggu.github.io/exhibition-club-survey/" />
  <meta property="og:image" content="https://psunggu.github.io/exhibition-club-survey/og-card.png?v=20261123-1" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" type="image/svg+xml" href="/exhibition-club-survey/icons/icon.svg?v=20261123-1" />
  <link rel="icon" type="image/png" sizes="32x32" href="/exhibition-club-survey/icons/icon-32.png?v=20261123-1" />
  <link rel="apple-touch-icon" sizes="180x180" href="/exhibition-club-survey/icons/icon-180.png?v=20261123-1" />
  <link rel="manifest" href="/exhibition-club-survey/manifest.webmanifest?v=20261123-1" />
  <meta name="apple-mobile-web-app-title" content="전시 동아리" />
</head>
<body>
  <div id="root"></div>
  <!-- 설정은 빌드에 박지 않는다. URL 이 바뀌어도 다시 빌드하지 않게.
       config.js 를 고치면 ?v= 도 올린다 — 안 올리면 다시 찾은 회원에게 옛 설정이 남는다. -->
  <script src="/exhibition-club-survey/config.js?v=20260927-1"></script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
